[project]
name = "price-tracker"
version = "0.1.0"
description = "Multi-exchange price tracker with cloud persistence and alerting"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "pandas>=2.1",
    "APScheduler>=3.10",
    "python-dotenv>=1.0",
    "pymongo[srv]>=4.6",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-mock>=3.12", "mongomock>=4.1", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
